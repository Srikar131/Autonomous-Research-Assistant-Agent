<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Research Console</title>
<style>
  /* ---- Tokens: one neutral palette, one semantic accent, one radius ---- */
  :root {
    --bg:        #fafaf9;   /* page                                   */
    --surface:   #ffffff;   /* raised input / report                  */
    --ink:       #1c1b1a;   /* off-black text (never #000)            */
    --ink-soft:  #4b4a48;   /* secondary text                         */
    --muted:     #8a8782;   /* tertiary / meta                        */
    --line:      #e7e5e1;   /* hairlines                              */
    --line-2:    #d9d6d1;   /* stronger hairline                      */
    --field:     #f3f1ee;   /* recessed fields / obs                  */
    --live:      #2f7d57;   /* semantic "running" only                */
    --r:         10px;      /* locked corner radius                   */
    --maxw:      760px;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
            Helvetica, Arial, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino,
             Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Segoe UI Mono", Menlo,
            Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: #1c1b1a; color: #fafaf9; }

  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }

  /* ---- Masthead ---- */
  header {
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  .masthead {
    display: flex; align-items: baseline; justify-content: space-between;
    height: 64px;
  }
  .mark {
    font-weight: 620; letter-spacing: -0.015em; font-size: 16px;
  }
  .mark .dim { color: var(--muted); font-weight: 500; }
  .model-tag {
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    letter-spacing: 0.01em;
  }

  /* ---- Intro ---- */
  .intro { padding: 64px 0 28px; }
  h1 {
    font-size: clamp(30px, 5.2vw, 44px);
    line-height: 1.04;
    letter-spacing: -0.03em;
    font-weight: 640;
    margin: 0 0 14px;
  }
  .lede {
    color: var(--ink-soft);
    font-size: 17px;
    max-width: 56ch;
    margin: 0;
  }

  /* ---- Composer ---- */
  .composer { padding: 22px 0 8px; }
  .field-row {
    display: flex; gap: 10px; align-items: stretch;
  }
  #topic {
    flex: 1;
    font-family: var(--sans);
    font-size: 16px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line-2);
    border-radius: var(--r);
    padding: 14px 16px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  #topic::placeholder { color: var(--muted); }
  #topic:focus {
    border-color: var(--ink);
    box-shadow: 0 0 0 3px rgba(28,27,26,0.08);
  }
  .btn {
    font-family: var(--sans);
    font-size: 15px; font-weight: 560;
    border-radius: var(--r);
    border: 1px solid var(--ink);
    cursor: pointer;
    transition: transform .08s ease, background .15s ease, opacity .15s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary {
    background: var(--ink); color: var(--bg);
    padding: 0 22px; white-space: nowrap;
  }
  .btn-primary:hover:not(:disabled) { background: #000; }
  .arrow { margin-left: 8px; }

  /* ---- Example chips (empty state) ---- */
  .examples {
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px;
  }
  .chip {
    font-family: var(--sans); font-size: 13px; color: var(--ink-soft);
    background: transparent;
    border: 1px solid var(--line-2);
    border-radius: 999px;
    padding: 7px 13px;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .chip:hover { border-color: var(--ink); color: var(--ink); background: var(--surface); }
  .examples-label {
    font-size: 12px; color: var(--muted); margin: 26px 0 0;
    letter-spacing: .01em;
  }

  /* ---- Status line ---- */
  .status {
    display: none; align-items: center; gap: 9px;
    margin: 30px 0 0; font-size: 14px; color: var(--ink-soft);
  }
  .status.show { display: flex; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--live); flex: none;
  }
  .status.running .dot { animation: pulse 1.4s ease-in-out infinite; }
  .status.done .dot { background: var(--muted); }
  @keyframes pulse {
    0%, 100% { opacity: 1;   transform: scale(1);   }
    50%      { opacity: .35; transform: scale(.78); }
  }

  /* ---- Trace ---- */
  .trace { margin: 18px 0 0; }
  .trace-head {
    font-size: 12px; color: var(--muted); letter-spacing: .04em;
    text-transform: uppercase; margin: 30px 0 10px;
    display: none;
  }
  .trace-head.show { display: block; }

  .step {
    border-left: 1px solid var(--line-2);
    padding: 4px 0 18px 18px;
    margin-left: 3px;
    position: relative;
    animation: rise .34s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  .step::before {
    content: ""; position: absolute; left: -4px; top: 9px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--line-2);
  }
  .step.active::before { background: var(--live); }
  .step.active { border-left-color: var(--line-2); }

  .step-tool {
    display: inline-block;
    font-family: var(--mono); font-size: 11.5px; font-weight: 600;
    letter-spacing: .02em; color: var(--ink);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 2px 8px;
    vertical-align: middle;
  }
  .step-arg {
    font-family: var(--mono); font-size: 12.5px; color: var(--muted);
    margin-left: 9px; word-break: break-word;
  }
  .step-thought {
    color: var(--ink-soft); font-size: 14.5px; margin: 9px 0 0;
  }

  .obs { margin-top: 10px; }
  .obs-toggle {
    font-family: var(--sans); font-size: 12.5px; color: var(--muted);
    background: none; border: none; padding: 0; cursor: pointer;
  }
  .obs-toggle:hover { color: var(--ink); }
  .obs-toggle::before { content: "+ "; }
  .obs-toggle.open::before { content: "– "; }
  .obs-body {
    display: none;
    font-family: var(--mono); font-size: 12px; line-height: 1.5;
    color: var(--ink-soft);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px; margin-top: 9px;
    white-space: pre-wrap; word-break: break-word;
    max-height: 260px; overflow: auto;
  }
  .obs-body.open { display: block; }

  /* skeleton (pending observation) */
  .skel {
    height: 11px; border-radius: 6px; background: var(--field);
    margin-top: 11px; animation: blink 1.2s ease-in-out infinite;
  }
  .skel.w1 { width: 88%; }
  .skel.w2 { width: 64%; margin-top: 7px; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

  /* ---- Report ---- */
  .report-wrap { display: none; margin: 40px 0 80px; }
  .report-wrap.show { display: block; }
  .report-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; border-top: 1px solid var(--line-2);
    padding-top: 26px; margin-bottom: 12px;
  }
  .report-meta { font-size: 13px; color: var(--muted); }
  .btn-ghost {
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line-2); padding: 9px 16px; font-size: 14px;
  }
  .btn-ghost:hover { border-color: var(--ink); }

  .report {
    font-family: var(--serif);
    font-size: 18px; line-height: 1.7; color: var(--ink);
  }
  .report h2 {
    font-family: var(--sans);
    font-size: 14px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); font-weight: 600;
    margin: 38px 0 12px; padding-bottom: 0;
  }
  .report h2:first-child { margin-top: 8px; }
  .report h3 { font-size: 19px; margin: 26px 0 8px; letter-spacing: -0.01em; }
  .report p { margin: 0 0 16px; }
  .report ul, .report ol { margin: 0 0 16px; padding-left: 1.25em; }
  .report li { margin: 0 0 9px; }
  .report li::marker { color: var(--muted); }
  .report a {
    color: var(--ink); text-decoration: underline;
    text-underline-offset: 2px; text-decoration-color: var(--line-2);
  }
  .report a:hover { text-decoration-color: var(--ink); }
  .report strong { font-weight: 640; }

  /* ---- Error ---- */
  .error {
    display: none; margin: 26px 0 0;
    border: 1px solid #e4c9c2; background: #fbf2ef;
    border-radius: var(--r); padding: 14px 16px;
    color: #7a3b2c; font-size: 14px;
  }
  .error.show { display: block; }

  footer {
    border-top: 1px solid var(--line);
    color: var(--muted); font-size: 13px;
    padding: 22px 0 40px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  @media (max-width: 560px) {
    .field-row { flex-direction: column; }
    .btn-primary { padding: 13px 22px; }
    .intro { padding-top: 44px; }
  }
</style>
</head>
<body>
  <header>
    <div class="wrap masthead">
      <div class="mark">Research Console<span class="dim"> / autonomous agent</span></div>
      <div class="model-tag" id="modelTag">gpt-4o-mini</div>
    </div>
  </header>

  <main class="wrap">
    <section class="intro">
      <h1>A research agent that shows its work.</h1>
      <p class="lede">
        Enter a topic. It searches the web, reads the sources, and writes a
        cited report while you watch every step.
      </p>
    </section>

    <section class="composer">
      <form id="form" autocomplete="off">
        <div class="field-row">
          <input id="topic" name="topic" type="text"
                 placeholder="Ask anything worth researching" />
          <button class="btn btn-primary" id="run" type="submit">
            Research<span class="arrow">&rarr;</span>
          </button>
        </div>
      </form>

      <div id="emptyState">
        <p class="examples-label">Try one of these</p>
        <div class="examples" id="examples">
          <button class="chip">How does the Raft consensus algorithm handle leader election</button>
          <button class="chip">Compare LangGraph vs CrewAI for multi-agent systems</button>
          <button class="chip">The state of solid-state batteries in 2026</button>
        </div>
      </div>

      <div class="status" id="status">
        <span class="dot"></span><span id="statusText">Working</span>
      </div>

      <div class="error" id="error"></div>
    </section>

    <section class="trace">
      <div class="trace-head" id="traceHead">Trace</div>
      <div id="steps"></div>
    </section>

    <section class="report-wrap" id="reportWrap">
      <div class="report-bar">
        <span class="report-meta" id="reportMeta"></span>
        <button class="btn btn-ghost" id="download">Download report</button>
      </div>
      <article class="report" id="report"></article>
    </section>
  </main>

  <footer>
    <div class="wrap">Runs locally against the OpenAI API and DuckDuckGo search.</div>
  </footer>

<script>
(function () {
  "use strict";

  var TOOL_LABEL = { web_search: "Search", fetch_page: "Read", summarise: "Summarise" };

  var form       = document.getElementById("form");
  var topicEl    = document.getElementById("topic");
  var runBtn     = document.getElementById("run");
  var emptyState = document.getElementById("emptyState");
  var statusEl   = document.getElementById("status");
  var statusText = document.getElementById("statusText");
  var errorEl    = document.getElementById("error");
  var traceHead  = document.getElementById("traceHead");
  var stepsEl    = document.getElementById("steps");
  var reportWrap = document.getElementById("reportWrap");
  var reportEl   = document.getElementById("report");
  var reportMeta = document.getElementById("reportMeta");
  var downloadBtn= document.getElementById("download");
  var modelTag   = document.getElementById("modelTag");

  var es = null;
  var stepNodes = {};       // step number -> DOM node
  var reportMarkdown = "";
  var currentTopic = "";

  document.querySelectorAll("#examples .chip").forEach(function (chip) {
    chip.addEventListener("click", function () {
      topicEl.value = chip.textContent.trim();
      topicEl.focus();
    });
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    start(topicEl.value.trim());
  });

  function setRunning(on) {
    runBtn.disabled = on;
    topicEl.disabled = on;
    runBtn.firstChild.textContent = on ? "Researching" : "Research";
  }

  function start(topic) {
    if (!topic || es) return;
    currentTopic = topic;

    // reset view into the "running" state
    stepNodes = {};
    stepsEl.innerHTML = "";
    reportEl.innerHTML = "";
    reportWrap.classList.remove("show");
    errorEl.classList.remove("show");
    emptyState.style.display = "none";
    traceHead.classList.add("show");
    statusEl.className = "status show running";
    statusText.textContent = "Starting";
    setRunning(true);

    es = new EventSource("/api/research?topic=" + encodeURIComponent(topic));
    es.onmessage = onMessage;
    es.onerror = function () {
      // Network drop or server close without a 'done' event.
      if (es) { stop(); showError("Connection to the agent was interrupted."); }
    };
  }

  function stop() {
    if (es) { es.close(); es = null; }
    setRunning(false);
  }

  function onMessage(e) {
    var ev;
    try { ev = JSON.parse(e.data); } catch (_) { return; }

    switch (ev.type) {
      case "start":
        modelTag.textContent = ev.model;
        statusText.textContent = "Searching and reading sources";
        break;
      case "thought":
        getStep(ev.step).thought(ev.text);
        break;
      case "action":
        getStep(ev.step).action(ev.tool, ev.input);
        setActive(ev.step);
        break;
      case "observation":
        getStep(ev.step).observation(ev.text);
        break;
      case "report":
        renderReport(ev.html, ev.markdown);
        break;
      case "done":
        finish(ev.elapsed, ev.steps);
        break;
      case "error":
        stop();
        showError(ev.message);
        break;
    }
  }

  // ---- step builder ----
  function getStep(n) {
    if (stepNodes[n]) return stepNodes[n].api;

    var node = document.createElement("div");
    node.className = "step";
    node.innerHTML =
      '<div class="step-line"><span class="step-tool"></span>' +
      '<span class="step-arg"></span></div>' +
      '<p class="step-thought" style="display:none"></p>' +
      '<div class="obs"></div>';
    stepsEl.appendChild(node);

    var toolEl    = node.querySelector(".step-tool");
    var argEl     = node.querySelector(".step-arg");
    var thoughtEl = node.querySelector(".step-thought");
    var obsEl     = node.querySelector(".obs");
    obsEl.innerHTML = '<div class="skel w1"></div><div class="skel w2"></div>';

    var api = {
      node: node,
      thought: function (text) {
        if (!text) return;
        thoughtEl.textContent = text;
        thoughtEl.style.display = "block";
      },
      action: function (tool, input) {
        toolEl.textContent = TOOL_LABEL[tool] || tool;
        argEl.textContent = input || "";
      },
      observation: function (text) {
        node.classList.remove("active");
        obsEl.innerHTML = "";
        var n = (text || "").length;
        var preview = text.length > 700 ? text.slice(0, 700) + " ..." : text;
        var toggle = document.createElement("button");
        toggle.className = "obs-toggle";
        toggle.textContent = "Result (" + n.toLocaleString() + " chars)";
        var body = document.createElement("div");
        body.className = "obs-body";
        body.textContent = preview;
        toggle.addEventListener("click", function () {
          var open = body.classList.toggle("open");
          toggle.classList.toggle("open", open);
        });
        obsEl.appendChild(toggle);
        obsEl.appendChild(body);
      }
    };
    stepNodes[n] = { node: node, api: api };
    return api;
  }

  function setActive(n) {
    Object.keys(stepNodes).forEach(function (k) {
      stepNodes[k].node.classList.toggle("active", String(k) === String(n));
    });
  }

  function renderReport(html, markdown) {
    reportMarkdown = markdown || "";
    reportEl.innerHTML = html || "";
    reportWrap.classList.add("show");
  }

  function finish(elapsed, steps) {
    stop();
    statusEl.className = "status show done";
    statusText.textContent = "Done in " + elapsed + "s";
    Object.keys(stepNodes).forEach(function (k) {
      stepNodes[k].node.classList.remove("active");
    });
    reportMeta.textContent =
      "Completed in " + elapsed + "s over " + steps + " step" +
      (steps === 1 ? "" : "s") + ".";
  }

  function showError(msg) {
    statusEl.className = "status";
    errorEl.textContent = msg;
    errorEl.classList.add("show");
  }

  downloadBtn.addEventListener("click", function () {
    if (!reportMarkdown) return;
    var safe = currentTopic.replace(/[^a-z0-9]+/gi, "_").slice(0, 40) || "report";
    var blob = new Blob(
      ["# Research Report: " + currentTopic + "\n\n" + reportMarkdown + "\n"],
      { type: "text/markdown" }
    );
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "research_" + safe + ".md";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  });
})();
</script>
</body>
</html>
